# Installed as /etc/systemd/journald.conf.d/scrp.conf (SU11A-32).
#
# The privacy policy says application logs are kept up to 30 days. scrp-api
# logs to journald (gunicorn access log + app warnings), which before this had
# no time limit, only the default size cap.
[Journal]
MaxRetentionSec=30day
# journald deletes whole archived files, and a file is only removed once its
# NEWEST entry is past the limit. The default MaxFileSec is one month, so
# without this an entry could survive almost 60 days. One file per day keeps
# the overshoot to about a day.
MaxFileSec=1day
