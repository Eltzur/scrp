# SU11A-49 (F-02) — rate limits for the SerpApi-backed flights endpoints.
# server context. Installed as /etc/nginx/snippets/xxl-ratelimit-fly.conf and
# included once in the 443 server of sites-available/fly.xxl.co.il.
#
# The flights API has no host of its own: fly.xxl.co.il proxies `location /api/`
# to 127.0.0.1:8001 and strips the /api prefix (proxy_pass ".../"). Of its
# routes, /search, /explore and /flexible-dates call SerpApi (paid quota) on a
# cache miss, for guests too. /airports, /price-calendar and /me read the
# database only and stay under the existing `location /api/` (no limit).
#
# This regex location wins over the `location /api/` prefix (regex locations
# are checked after prefixes unless the prefix uses ^~, which it does not).
# A regex location cannot give proxy_pass a URI, so the prefix is stripped with
# rewrite ... break, which keeps the query string.
location ~ ^/api/(search|explore|flexible-dates)(/|$) {
    # 10 per minute per IP, 5 at once: a search page fires /search plus
    # /flexible-dates together, and a person rarely runs more than a few
    # searches a minute.
    limit_req zone=xxl_serp burst=5 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # explore waits up to 60 s on SerpApi (backend/api/routers/explore.py).
    proxy_read_timeout 90s;
}

# Same JSON shape as api-super. Same origin as the page, so no CORS needed.
error_page 429 = @xxl_rate_limited_fly;
location @xxl_rate_limited_fly {
    default_type application/json;
    include snippets/xxl-security-headers.conf;
    add_header Retry-After "10" always;
    add_header Cache-Control "no-store" always;
    return 429 '{"code":"rate_limited"}\n';
}
