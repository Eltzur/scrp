# SU11A-49 (F-03) — security headers. server (or location) context.
# Installed as /etc/nginx/snippets/xxl-security-headers.conf and included in
# the 443 server of xxl.co.il, super.xxl.co.il, fly.xxl.co.il and
# api-super.xxl.co.il.
#
# THE add_header INHERITANCE RULE: a block inherits add_header from the level
# above ONLY IF it has no add_header of its own. One add_header in a location
# (super's static-asset location sets Cache-Control) silently drops every
# server-level header for that location. So every location with its own
# add_header must include this file again (and, on the web hosts, the CSP
# snippet). The runbook lists each one.
#
# `always`: also on 4xx/5xx answers (404, 429, 503), not only 2xx/3xx.

# HTTPS only for a year. No includeSubDomains and no preload until every
# subdomain is verified to serve HTTPS (a preload cannot be undone quickly).
add_header Strict-Transport-Security "max-age=31536000" always;
# No MIME sniffing: a JSON or text answer is never run as a script.
add_header X-Content-Type-Options "nosniff" always;
# Full URL to our own pages, origin only to other sites, nothing over http.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# No framing (clickjacking of sign-in / account deletion). The CSP Report-Only
# policy has frame-ancestors 'none' too; this header is the enforced one.
add_header X-Frame-Options "DENY" always;
# The web apps use no camera, microphone or browser geolocation (city
# detection is by stored choice; the phone app computes distance itself).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
