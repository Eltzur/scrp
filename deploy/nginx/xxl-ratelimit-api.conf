# SU11A-49 (F-02) — rate limits for api-super.xxl.co.il. server context.
# Installed as /etc/nginx/snippets/xxl-ratelimit-api.conf and included once in
# the 443 server of sites-available/api-super.xxl.co.il, after
# `include snippets/api-noindex.conf;`. Needs conf.d/xxl-ratelimit-http.conf
# (zones, 429 status, the CORS map) and snippets/xxl-api-proxy.conf.
#
# How the limits combine: a location with its own limit_req does NOT inherit
# the server-level one (same rule as add_header), so the heavy locations list
# both zones explicitly. /suggest and images have their own zone only.
# An over-limit request gets 429 {"code":"rate_limited"} from nginx and never
# reaches gunicorn.

# Everything not matched below: `location /`, the ACME path, robots.txt.
limit_req zone=xxl_api burst=40 nodelay;

# Heavy: each call prices many barcodes (/compare: up to 1,000 since SU11A-49;
# /basket/compare: 25 barcodes in every store; /promos/grouped: up to 5,000
# rows). /search cannot be split here (city / chain are query parameters), so
# it stays in the general zone; F-01's cap and the 15 s DB timeout cover it.
location = /compare {
    limit_req zone=xxl_heavy burst=10 nodelay;
    limit_req zone=xxl_api burst=40 nodelay;
    include snippets/xxl-api-proxy.conf;
}
location = /basket/compare {
    limit_req zone=xxl_heavy burst=10 nodelay;
    limit_req zone=xxl_api burst=40 nodelay;
    include snippets/xxl-api-proxy.conf;
}
location = /promos/grouped {
    limit_req zone=xxl_heavy burst=10 nodelay;
    limit_req zone=xxl_api burst=40 nodelay;
    include snippets/xxl-api-proxy.conf;
}

# Type-ahead: cheap and cached, but one call per keystroke.
location = /suggest {
    limit_req zone=xxl_suggest burst=60 nodelay;
    include snippets/xxl-api-proxy.conf;
}

# Product images: a results page asks for 20-30 at once.
location ~ ^/product/[0-9]+/image$ {
    limit_req zone=xxl_img burst=200 nodelay;
    include snippets/xxl-api-proxy.conf;
}

# The 429 body. This location has its own add_header, so it inherits none from
# the server: the security headers and X-Robots-Tag are repeated here, plus
# CORS (FastAPI never sees this request) so the web app can read the status.
error_page 429 = @xxl_rate_limited;
location @xxl_rate_limited {
    default_type application/json;
    include snippets/xxl-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Access-Control-Allow-Origin $xxl_api_cors_origin always;
    add_header Vary "Origin" always;
    add_header Retry-After "2" always;
    add_header Cache-Control "no-store" always;
    return 429 '{"code":"rate_limited"}\n';
}
