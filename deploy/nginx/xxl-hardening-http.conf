# SU11A-49 (F-03) — http-level hardening.
# Installed as /etc/nginx/conf.d/xxl-hardening-http.conf.
#
# No version in the Server header or on nginx error pages
# ("nginx" instead of "nginx/1.24.0 (Ubuntu)"). nginx.conf has this line
# commented out (`# server_tokens off;`), so there is no duplicate.
server_tokens off;

# NOT here: ssl_protocols. nginx.conf already sets it at http level
# ("TLSv1 TLSv1.1 TLSv1.2 TLSv1.3"); a second ssl_protocols in the same context
# is a "duplicate" error. The runbook edits that line in nginx.conf instead
# (to "TLSv1.2 TLSv1.3"). Every 443 server already gets TLS 1.2/1.3 from
# certbot's options-ssl-nginx.conf, so that edit changes nothing in practice.
