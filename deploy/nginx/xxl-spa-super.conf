# SU11A-81 (SU11A-79 H5): the SPA fallback for super.xxl.co.il.
#
# One web build serves xxl.co.il and super.xxl.co.il (same root,
# /var/www/super.xxl.co.il). Since SU11A-81 the build writes two HTML files with
# the same assets but each site's own head (title, description, canonical,
# Open Graph / Twitter), for crawlers that do not run JS:
#   index.html        - the portal (xxl.co.il, www.xxl.co.il; admin.xxl.co.il)
#   index.super.html  - super.xxl.co.il
#
# Installed as /etc/nginx/snippets/xxl-spa-super.conf and included in the
# super.xxl.co.il 443 server block, INSIDE its `location / { ... }`, in place of
# that location's existing try_files line (keep everything else in the block):
#
#     location / {
#         include snippets/xxl-spa-super.conf;
#     }
#
# No `$uri/` on purpose: with it, "/" would be answered by the `index`
# directive (index.html, the portal's head). Without it, "/" and every route
# fall through to index.super.html. Real files (assets, og-super.png,
# robots.txt, the sitemaps) still match `$uri` first.
#
# ORDER: deploy the web FIRST (index.super.html must exist in the web root),
# then install this and reload. If the file is missing, every route returns
# 404 - nginx -t cannot catch that. Runbook: docs/super/handoff_super.md, SU11A-81.
# The xxl.co.il and admin.xxl.co.il blocks are unchanged (they keep /index.html).

try_files $uri /index.super.html;
