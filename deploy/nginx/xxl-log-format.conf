# SU11A-69 — the shared access log with the site name at the end.
# Installed as /etc/nginx/conf.d/xxl-log-format.conf (docs/admin/su11a69_runbook.md
# step 5), together with commenting out the plain
#     access_log /var/log/nginx/access.log;
# line in /etc/nginx/nginx.conf: conf.d is included AFTER that line, and a second
# access_log at the same level would write every request twice.
#
# Exactly nginx's built-in `combined` plus ` "$host"` at the end, so every
# existing grep / tool (su11a49 runbook) still works. The host is not personal
# data; nothing else is added. Retention is unchanged (logrotate, 14 days).
# Sites with their own access_log (api-super.access.log) keep `combined`.
#
# scripts/stats_logs.py needs the host to count super.xxl.co.il, xxl.co.il,
# www.xxl.co.il and fly.xxl.co.il apart and to leave admin.xxl.co.il out.

log_format xxl_vhost '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$host"';

access_log /var/log/nginx/access.log xxl_vhost;
