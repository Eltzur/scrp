# SU11A-69 — the shared access log with the site name at the end.
# SU11A-70 — plus the "don't count this browser" flag after it.
# Installed as /etc/nginx/conf.d/xxl-log-format.conf (docs/admin/su11a69_runbook.md
# step 5; SU11A-70 replaces the file: docs/admin/su11a70_runbook.md), together
# with commenting out the plain
#     access_log /var/log/nginx/access.log;
# line in /etc/nginx/nginx.conf: conf.d is included AFTER that line, and a second
# access_log at the same level would write every request twice.
#
# Exactly nginx's built-in `combined` plus ` "$host"` and ` "$xxl_internal"` at
# the end, so every existing grep / tool (su11a49 runbook) still works.
# Neither field is personal data; nothing else is added. Retention is unchanged
# (logrotate, 14 days). Sites with their own access_log (api-super.access.log)
# keep `combined`.
#
# $xxl_internal is "1" when the browser carries the cookie xxl_internal=1 (set
# by the admin console's "don't count this browser" switch), otherwise "-".
# The map outputs ONLY those two values: the cookie's own value is never logged.
#
# scripts/stats_logs.py needs the host to count super.xxl.co.il, xxl.co.il,
# www.xxl.co.il and fly.xxl.co.il apart and to leave admin.xxl.co.il out, and
# the flag to leave the team's own page views out.

map $cookie_xxl_internal $xxl_internal {
    "1"      "1";
    default  "-";
}

log_format xxl_vhost '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$host" "$xxl_internal"';

access_log /var/log/nginx/access.log xxl_vhost;
