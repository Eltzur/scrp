# SU11A-54 — admin.xxl.co.il: the admin console (phase 1).
# Installed as /etc/nginx/sites-available/admin.xxl.co.il (+ symlink in
# sites-enabled) AFTER the certificate exists: docs/admin/su11a54_runbook.md
# gets it first with admin.xxl.co.il.bootstrap.conf + `certbot certonly --nginx`.
#
# Same web root as super.xxl.co.il: one React build, and on this host
# web/src/App.tsx renders only the lazily loaded admin app (no shop UI).
# The API stays on api-super.xxl.co.il, which allows this origin in CORS
# (api/main.py ADMIN_ORIGIN; conf.d/xxl-ratelimit-http.conf for the 429).
#
# Layout copied from the live sites-available/super.xxl.co.il (certbot style,
# IPv4 listens only, as on every site of this server).

server {
    listen 80;
    server_name admin.xxl.co.il;
    # A location (not a server-level return), so certbot renewals can still
    # add their /.well-known/acme-challenge/ location in front of it.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin.xxl.co.il;

    ssl_certificate /etc/letsencrypt/live/admin.xxl.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.xxl.co.il/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/super.xxl.co.il;
    index index.html;

    # Static files and index.html only; a person loads about 15 files once.
    limit_req zone=xxl_api burst=40 nodelay;

    include snippets/xxl-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # The HTML is never cached: a new build must reach the console at once.
    add_header Cache-Control "no-store" always;
    # REPORT-ONLY, like xxl-csp-web.conf (switch the name to enforce later).
    # Narrower than the shop's: no analytics. script: the Vite bundle plus the
    # one inline script of index.html (same hash as xxl-csp-web.conf; recompute
    # together, SU11A-49 runbook step 5). connect: the API and Supabase (auth,
    # MFA). img: 'self' and data: (the TOTP QR code is a data: SVG). Google
    # Fonts because index.html loads Rubik.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-LO2icOS4USz6HYBRrTSoEr8dKWyC8lMuaisAr14JTZA='; connect-src 'self' https://api-super.xxl.co.il https://dwohlwmiejgjlsbuegeu.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # The web root's robots.txt is the shop's; this host is never indexed.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundle files: long cache. This location has its own add_header,
    # so it inherits none from the server (see xxl-security-headers.conf):
    # the headers are repeated.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control public;
        include snippets/xxl-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
