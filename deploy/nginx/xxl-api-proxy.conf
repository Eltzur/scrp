# SU11A-49 — the proxy settings of api-super.xxl.co.il's `location /`, for the
# extra locations that snippets/xxl-ratelimit-api.conf adds (each location
# needs its own proxy_pass). Installed as /etc/nginx/snippets/xxl-api-proxy.conf.
# Keep it identical to `location /` in sites-available/api-super.xxl.co.il.
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
proxy_connect_timeout 10s;
