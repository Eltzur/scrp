# SU11A-49 (F-02) — rate-limit zones. http context.
# Installed as /etc/nginx/conf.d/xxl-ratelimit-http.conf (nginx.conf includes
# conf.d/*.conf inside http {}). Used by snippets/xxl-ratelimit-api.conf
# (api-super.xxl.co.il) and snippets/xxl-ratelimit-fly.conf (fly.xxl.co.il).
#
# Key = client IP. nginx is the edge (no CDN or load balancer in front), so
# $binary_remote_addr is the real client address. 10m of zone memory holds
# about 160,000 addresses per zone.
#
# Mobile carrier NAT: Israeli mobile networks put many subscribers behind one
# public IP, so the limits are per-IP ceilings sized for several people at once,
# with generous bursts and `nodelay` (a burst is served at once, never queued).
# Rates and the reasoning: docs/security/su11a49_runbook.md, "Rate limits".

# General API: about 20x the busiest single human (a page view is 1-6 calls).
limit_req_zone $binary_remote_addr zone=xxl_api:10m     rate=10r/s;
# /compare, /basket/compare, /promos/grouped: each one prices many barcodes.
limit_req_zone $binary_remote_addr zone=xxl_heavy:10m   rate=2r/s;
# /suggest: one request per keystroke (debounced 160 ms on web and mobile).
limit_req_zone $binary_remote_addr zone=xxl_suggest:10m rate=20r/s;
# /product/{barcode}/image: cheap file reads; a results page shows 20-30.
limit_req_zone $binary_remote_addr zone=xxl_img:10m     rate=30r/s;
# fly.xxl.co.il SerpApi-backed endpoints: every call spends paid quota.
limit_req_zone $binary_remote_addr zone=xxl_serp:10m    rate=10r/m;

# 429, not the default 503: clients and logs can tell "slow down" from "down".
limit_req_status 429;
# Rejections at warn (delays would be one level lower; nodelay means none).
limit_req_log_level warn;

# CORS for the 429 answer of api-super.xxl.co.il. FastAPI adds CORS headers to
# every API response, but a request nginx rejects never reaches FastAPI; without
# Access-Control-Allow-Origin the browser hides the 429 and the web app sees a
# network error. Same allow-list as ALLOWED_ORIGINS in production; an empty
# value means nginx sends no header. One anchored regex rather than three
# exact keys: regex entries need no map_hash_bucket_size tuning (exact keys
# this long failed `nginx -t` on a 32-byte bucket in the SU11A-49 test).
# SU11A-54: admin.xxl.co.il added (the admin console calls api-super too).
map $http_origin $xxl_api_cors_origin {
    default                                             "";
    "~^https://(www\.|super\.|admin\.)?xxl\.co\.il$"    $http_origin;
}
