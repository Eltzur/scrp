# SU11A-49 (F-03) — Content-Security-Policy, REPORT-ONLY, for fly.xxl.co.il.
# Installed as /etc/nginx/snippets/xxl-csp-fly.conf; included next to
# xxl-security-headers.conf in fly's 443 server.
#
# Enumerated from xxl-flights/frontend: Vite bundle (no inline script in
# index.html), the flights API on the same origin (/api/), the shared Supabase
# project (auth), GA4 after consent, Google Fonts.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://dwohlwmiejgjlsbuegeu.supabase.co https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
