# SU11A-49 (F-03) — Content-Security-Policy, REPORT-ONLY, for xxl.co.il and
# super.xxl.co.il (one React build serves both). Installed as
# /etc/nginx/snippets/xxl-csp-web.conf; included next to
# xxl-security-headers.conf in both 443 servers and in super's static-asset
# location.
#
# Report-Only: the browser enforces nothing, it only prints a console line
# ("[Report Only] Refused to ...") for anything outside the list. After a week
# with no such line on the main pages (home, search, product modal, sign-in,
# account, cookie banner accept -> GA4), switch the header name to
# Content-Security-Policy. No report-uri yet (no endpoint to receive them).
#
# Enumerated from the code (SU11A-49):
#   script  'self' (Vite bundle); the one inline script in index.html (SEO host
#           fix) by hash; GA4 gtag.js from www.googletagmanager.com, injected
#           only after cookie consent (web/src/utils/analytics.ts).
#   connect the API (VITE_API_URL), the Supabase project (auth, the
#           portal_email_signups insert; no realtime is used, so no wss:),
#           GA4 collect endpoints.
#   img     'self', data: (inline SVG / icons), product images from the API,
#           GA4 pixels.
#   style   'self', Google Fonts CSS; 'unsafe-inline' for styles injected at
#           runtime (toast library). Inline style attributes set from React
#           are not affected either way.
#   font    Google Fonts files.
#   Not listed on purpose: http://ip-api.com (city auto-detect,
#           web/src/utils/city.ts). Browsers block it as mixed content
#           already; F-12 in the SU11A-48 review says remove it.
#
# THE HASH: sha256 of the inline <script> body in web/dist/index.html (build
# of SU11A-49). If that script changes, recompute (runbook step 5) or the
# report will flag it.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-LO2icOS4USz6HYBRrTSoEr8dKWyC8lMuaisAr14JTZA=' https://www.googletagmanager.com; connect-src 'self' https://api-super.xxl.co.il https://dwohlwmiejgjlsbuegeu.supabase.co https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://api-super.xxl.co.il https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
