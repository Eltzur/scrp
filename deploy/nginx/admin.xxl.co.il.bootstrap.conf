# SU11A-54 — temporary site for admin.xxl.co.il, ONLY until the certificate
# exists (docs/admin/su11a54_runbook.md step 6). It serves nothing: certbot's
# nginx plugin adds its challenge location to this server for the duration of
# `certbot certonly --nginx -d admin.xxl.co.il`, then removes it. Replaced by
# admin.xxl.co.il.conf right after (same file name in sites-available).
server {
    listen 80;
    server_name admin.xxl.co.il;
    location / {
        return 404;
    }
}
