<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO — static fallbacks default to portal (xxl.co.il).
         Runtime override in App.tsx switches to supermarket-app values on super.xxl.co.il. -->
    <title>XXL — הפורטל שהופך כסף רגיל לכסף חכם</title>
    <meta name="description" content="השוואת מחירים חכמה למצרכים, חופשות ואופנה. חוסכים בענקקק.">
    <meta name="keywords" content="השוואת מחירים, סופרמרקט, חופשות, אופנה, חיסכון, ישראל">

    <!-- Open Graph -->
    <meta property="og:type"         content="website">
    <meta property="og:site_name"    content="XXL">
    <meta property="og:title"        content="XXL — הפורטל שהופך כסף רגיל לכסף חכם">
    <meta property="og:description"  content="השוואת מחירים חכמה למצרכים, חופשות ואופנה. חוסכים בענקקק.">
    <meta property="og:url"          content="https://xxl.co.il">
    <meta property="og:image"        content="https://xxl.co.il/og-portal.png">
    <meta property="og:image:width"  content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale"       content="he_IL">

    <!-- Twitter / X cards -->
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="XXL — הפורטל שהופך כסף רגיל לכסף חכם">
    <meta name="twitter:description" content="השוואת מחירים חכמה למצרכים, חופשות ואופנה.">
    <meta name="twitter:image"       content="https://xxl.co.il/og-portal.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
